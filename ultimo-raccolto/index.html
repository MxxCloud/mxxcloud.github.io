    suo: nei minuti dopo una pubblicazione il browser può ricevere gioco.js
    nuovo e mondo/mappa.js vecchio. Il numero a schermo sta in gioco.js, quindi
    diceva M7.15.7 mentre l'orto si disegnava ancora come in M7.15.6 — ed è
    così che una correzione giusta è sembrata non funzionare.

    dall'origine insieme a tutti gli altri. La versione è quella di VERSIONE in
